name: Build

# No push trigger on main: a merge is followed by a tag, and the Release workflow builds and
# tests that same commit. Branch builds are started by hand (workflow_dispatch).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        # Room's schema export: debug and release KSP write the same schemas/<version>.json, and in
        # parallel one can read it half-written ("Empty schema file"). Run them one after the other.
        run: |
          ./gradlew kspDebugKotlin --no-parallel
          ./gradlew kspReleaseKotlin --no-parallel
          ./gradlew test --stacktrace

      # Branch builds get a release APK signed with the fork's fixed key, so a test build installs
      # over the previous one and keeps its data. Where secrets are not available (pull requests
      # from forks) a debug APK is built instead.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        if: env.KEYSTORE_PATH == ''
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: env.KEYSTORE_PATH == ''
        uses: actions/upload-artifact@v4
        with:
          name: opentv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Assemble signed release APK
        if: env.KEYSTORE_PATH != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: env.KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: opentv-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
